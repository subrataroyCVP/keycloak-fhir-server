name: fhir-smart-keycloak

services:
  dev-cert:
    image: alpine:3.20
    volumes:
      - ./certs:/certs
      - ./generate-dev-cert.sh:/generate-dev-cert.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -d /certs/server.crt ] || [ -d /certs/server.key ]; then
          rm -rf /certs/server.crt /certs/server.key
        fi
        if [ -f /certs/server.crt ] && [ -f /certs/server.key ]; then
          chmod a+r /certs/server.crt /certs/server.key
          exit 0
        fi
        apk add --no-cache openssl
        sh /generate-dev-cert.sh
        chmod a+r /certs/server.crt /certs/server.key
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    depends_on:
      dev-cert:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/opt/keycloak/start-dev.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "9f4ae588a43b3f830996082ff43afba0"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "8444:8443"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - ./certs:/opt/keycloak/certs:ro
      - ./scripts/start-dev.sh:/opt/keycloak/start-dev.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
